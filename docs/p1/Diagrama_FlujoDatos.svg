<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="910" viewBox="0 0 1180 910" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
    <marker id="darrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="910" fill="#ffffff"/>

  <!-- Title -->
  <text x="590" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Galeria Segura - Flujo de datos, puertos y limites de confianza</text>
  <text x="590" y="64" text-anchor="middle" font-size="14" fill="#6b7280">Modelo de amenazas (DFD) - commit 774d070 / tag p1-analisis - laboratorio local (todo por HTTP)</text>

  <!-- ===== Trust boundaries (dashed red) ===== -->
  <rect x="40" y="100" width="380" height="360" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="56" y="124" font-size="13" font-weight="700" fill="#dc2626">Equipo del usuario (navegador) - ZONA NO CONFIABLE</text>

  <rect x="680" y="100" width="460" height="205" rx="12" fill="#f0fdf4" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="696" y="124" font-size="14" font-weight="700" fill="#dc2626">Servidor FastAPI - ZONA CONFIABLE</text>

  <rect x="640" y="360" width="500" height="245" rx="12" fill="#fffbeb" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="656" y="384" font-size="14" font-weight="700" fill="#dc2626">Almacenamiento del servidor (base de datos, imagenes y secretos)</text>

  <!-- ===== Dependency boundary (dashed purple) ===== -->
  <rect x="40" y="645" width="1100" height="120" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="56" y="668" font-size="14" font-weight="700" fill="#7c3aed">Dependencias externas (cadena de suministro) - npm, PyPI y CDN</text>

  <!-- ===== Data flows ===== -->
  <g stroke="#374151" stroke-width="2.2" fill="none">
    <line x1="220" y1="224" x2="220" y2="286" marker-end="url(#arrow)"/>
    <path d="M292 356 C 470 300, 640 232, 830 198" marker-end="url(#arrow)"/>
    <path d="M832 220 C 640 330, 470 408, 294 398" marker-end="url(#arrow)"/>
    <line x1="878" y1="262" x2="748" y2="418" marker-end="url(#arrow)"/>
    <line x1="946" y1="262" x2="962" y2="418" marker-end="url(#arrow)"/>
    <line x1="902" y1="270" x2="834" y2="513" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== Dependency flows (dashed purple) ===== -->
  <g stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="7 5">
    <line x1="180" y1="677" x2="198" y2="432" marker-end="url(#darrow)"/>
    <path d="M425 677 C 400 560, 330 470, 280 418" marker-end="url(#darrow)"/>
    <line x1="970" y1="677" x2="932" y2="278" marker-end="url(#darrow)"/>
  </g>

  <!-- flow labels -->
  <g font-size="13" fill="#1f2937">
    <text x="236" y="262">1. Abre la web (HTTP)</text>
    <rect x="452" y="250" width="296" height="20" fill="#ffffff" opacity="0.9"/>
    <text x="456" y="265">2. Peticiones /api - HTTP (proxy :5173 -&gt; :8000)</text>
    <rect x="398" y="338" width="300" height="20" fill="#ffffff" opacity="0.9"/>
    <text x="402" y="353">3. Respuestas HTTP (JSON, token, imagenes)</text>
    <rect x="612" y="330" width="178" height="20" fill="#ffffff" opacity="0.9"/>
    <text x="616" y="345">4. SQL (usuarios y albumes)</text>
    <text x="980" y="336">5. Archivos</text>
    <text x="980" y="352">de imagen</text>
    <rect x="840" y="392" width="128" height="20" fill="#ffffff" opacity="0.9"/>
    <text x="844" y="407">6. Lee SECRET_KEY</text>
  </g>
  <!-- dependency flow labels -->
  <g font-size="12" fill="#6d28d9" font-style="italic">
    <rect x="96" y="548" width="118" height="18" fill="#ffffff" opacity="0.9"/>
    <text x="100" y="562">instala (build)</text>
    <rect x="330" y="520" width="130" height="18" fill="#ffffff" opacity="0.9"/>
    <text x="334" y="534">scripts en runtime</text>
    <rect x="936" y="470" width="118" height="18" fill="#ffffff" opacity="0.9"/>
    <text x="940" y="484">instala (build)</text>
  </g>

  <!-- ===== Nodes ===== -->
  <!-- Usuario -->
  <rect x="110" y="150" width="220" height="74" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="220" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Usuario</text>
  <text x="220" y="202" text-anchor="middle" font-size="13" fill="#1e3a8a">(Navegador Web)</text>

  <!-- Frontend -->
  <circle cx="220" cy="360" r="72" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="220" y="346" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">Frontend</text>
  <text x="220" y="365" text-anchor="middle" font-size="12.5" fill="#14532d">React + Vite</text>
  <text x="220" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">sirve en :5173</text>

  <!-- API -->
  <circle cx="910" cy="200" r="76" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="910" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">API FastAPI</text>
  <text x="910" y="205" text-anchor="middle" font-size="12.5" fill="#14532d">Uvicorn</text>
  <text x="910" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">escucha en :8000</text>

  <!-- Data stores -->
  <g>
    <path d="M670 428 v55 a70 10 0 0 0 140 0 v-55" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <ellipse cx="740" cy="428" rx="70" ry="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="740" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">SQLite</text>
    <text x="740" y="478" text-anchor="middle" font-size="11" fill="#713f12">(test.db)</text>
  </g>
  <g>
    <path d="M882 428 v55 a78 10 0 0 0 156 0 v-55" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <ellipse cx="960" cy="428" rx="78" ry="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="960" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#713f12">Imagenes</text>
    <text x="960" y="478" text-anchor="middle" font-size="11" fill="#713f12">(uploads/)</text>
  </g>
  <g>
    <path d="M745 523 v55 a85 10 0 0 0 170 0 v-55" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <ellipse cx="830" cy="523" rx="85" ry="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
    <text x="830" y="557" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Secretos (.env)</text>
    <text x="830" y="573" text-anchor="middle" font-size="11" fill="#7f1d1d">SECRET_KEY</text>
  </g>

  <!-- Dependency nodes -->
  <rect x="80" y="677" width="200" height="58" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="180" y="702" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">npm</text>
  <text x="180" y="720" text-anchor="middle" font-size="11.5" fill="#5b21b6">(paquetes del frontend)</text>

  <rect x="320" y="677" width="210" height="58" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="425" y="702" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">CDN jsdelivr</text>
  <text x="425" y="720" text-anchor="middle" font-size="11.5" fill="#5b21b6">(scripts/estilos en runtime)</text>

  <rect x="860" y="677" width="220" height="58" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="970" y="702" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">PyPI</text>
  <text x="970" y="720" text-anchor="middle" font-size="11.5" fill="#5b21b6">(paquetes del backend)</text>

  <!-- Risk note -->
  <text x="590" y="788" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Cada flecha que cruza una linea de color es un punto de riesgo (ver escenarios E1-E6).</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="800" width="1100" height="95" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="56" y="824" font-size="14" font-weight="700" fill="#111827">Como leer el diagrama</text>

  <rect x="60" y="838" width="32" height="18" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="102" y="852" font-size="12.5" fill="#1f2937">Rectangulo = Entidad externa</text>

  <circle cx="415" cy="847" r="11" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="438" y="852" font-size="12.5" fill="#1f2937">Circulo = Proceso</text>

  <path d="M690 840 v12 a15 4 0 0 0 30 0 v-12" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <ellipse cx="705" cy="840" rx="15" ry="4" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text x="730" y="852" font-size="12.5" fill="#1f2937">Cilindro = Almacen de datos</text>

  <line x1="60" y1="878" x2="92" y2="878" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="102" y="883" font-size="12.5" fill="#1f2937">Linea roja = Limite de confianza</text>

  <line x1="415" y1="878" x2="447" y2="878" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="457" y="883" font-size="12.5" fill="#1f2937">Linea morada = Dependencia (cadena de suministro)</text>
</svg>
